<title>Game Night Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: sticky scoreboard header + tab bar, one column of panels; Poker = felt green, FIFA = floodlight blue */
:root{
  --bg:#eceeea; --surface:#ffffff; --sunk:#f4f5f2; --ink:#141a19; --muted:#5b6662; --line:#d3d9d4;
  --felt:#16694a; --felt-deep:#0f4f37; --on-felt:#f3fbf6; --pitch:#2f4fd6; --on-pitch:#ffffff; --red:#bf3527; --gold:#9a6f12; --ok:#1d7a4c;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1211; --surface:#171d1c; --sunk:#121716; --ink:#e7ece9; --muted:#93a19b; --line:#2b3432;
  --felt:#1f8a60; --felt-deep:#14583e; --on-felt:#f3fbf6; --pitch:#8293ff; --on-pitch:#0b1030; --red:#ef6b5b; --gold:#e3b04a; --ok:#4fc78b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1211; --surface:#171d1c; --sunk:#121716; --ink:#e7ece9; --muted:#93a19b; --line:#2b3432;
  --felt:#1f8a60; --felt-deep:#14583e; --on-felt:#f3fbf6; --pitch:#8293ff; --on-pitch:#0b1030; --red:#ef6b5b; --gold:#e3b04a; --ok:#4fc78b; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
table{font:inherit;color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:0 48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--red);font-weight:800}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sync{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.live{color:var(--ok);border-color:currentColor}
.me{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-weight:700;font-size:13px;cursor:pointer;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}

main{display:grid;gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;line-height:1.1;text-wrap:balance;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.tag{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:99px;color:var(--muted);border:1px solid var(--line)}
.tag.poker{color:var(--felt);border-color:currentColor}
.tag.fifa{color:var(--pitch);border-color:currentColor}
.tag.live{color:var(--red);border-color:currentColor}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.felt{background:var(--felt);color:var(--on-felt);border-color:var(--felt)}
.btn.pitch{background:var(--pitch);color:var(--on-pitch);border-color:var(--pitch)}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.big{min-height:48px;padding:10px 18px;font-size:16px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.step button{width:44px;height:44px;border:0;background:var(--sunk);font-size:20px;font-weight:700;cursor:pointer}
.step span{min-width:36px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;min-height:42px;min-width:0;width:100%}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}

/* poker */
.pot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--felt-deep);color:var(--on-felt);border-radius:var(--r);padding:14px;text-align:center}
.pot b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(26px,8vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.pot span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .name{flex:1 1 120px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.li .name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chips{display:inline-flex;gap:3px;flex-wrap:wrap;max-width:120px}
.chip{width:12px;height:12px;border-radius:50%;background:var(--felt);border:2px dashed var(--on-felt);box-shadow:0 0 0 1px var(--felt)}
.cs{display:grid;gap:6px}
.csr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.csr:first-child{border-top:0}
.sw{width:28px;height:28px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);box-shadow:0 0 0 1px var(--line),inset 0 0 0 2px rgba(0,0,0,.12);flex:none}
.counter{flex-basis:100%;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px}
.counter .csr input{width:84px}
.ctotal{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--red)}
.place{font-family:var(--display);font-weight:800;font-size:20px;min-width:28px}

/* fifa */
.match{border-radius:var(--r);padding:14px;background:var(--sunk);border:1px solid var(--line);display:grid;gap:12px}
.match.live{border-color:var(--pitch);box-shadow:inset 0 0 0 1px var(--pitch)}
.stage{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pitch);text-align:center}
.stage .livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.stage .livedot{animation:pulse 1.4s infinite}}
@keyframes pulse{50%{opacity:.3}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;text-align:center}
.vs .pl{font-weight:800;overflow-wrap:anywhere;min-width:0;display:grid;gap:6px;justify-items:center}
.vs .pl small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:4px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left;white-space:normal}
.tbl td:nth-child(2){font-weight:700;min-width:110px}
@media (max-width:460px){.tbl .wide{display:none}}
.tbl tr.top1 td:first-child{color:var(--gold);font-weight:800}
.mrow{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .a{text-align:right;font-weight:600;overflow-wrap:anywhere;min-width:0}
.mrow .b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mrow small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mrow .s{font-variant-numeric:tabular-nums;font-weight:800;min-width:52px;text-align:center}
.mrow .w{color:var(--ink)} .mrow .l{color:var(--muted)}
.mrow .meta{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.startgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.startgrid .side{display:grid;gap:8px;min-width:0}
.startgrid .v{font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted);padding-bottom:10px}
@media (max-width:460px){.startgrid{grid-template-columns:1fr}.startgrid .v{padding:0;text-align:center}}

.toggle{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:34px;color:var(--muted)}
.toggle.on.p{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
.toggle.on.f{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) auto auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;width:34px;height:34px}
@media (max-width:620px){
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .prow .pn{grid-column:1/3}
  .prow .x{grid-column:3;grid-row:1}
}
.grow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px;font-size:14px}
.notice.warn{border-color:var(--gold);color:var(--ink)}
.login{display:grid;gap:16px;padding-block:8px}
.login .big{font-family:var(--display);font-weight:800;font-size:40px;text-transform:uppercase;line-height:1}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.names button{min-height:54px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer;overflow-wrap:anywhere;padding:6px}
.names button:hover{border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.banner{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;border:1px solid var(--red);color:var(--ink);background:var(--surface)}
.banner b{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>

<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand">Game <b>♠︎</b> Night</div>
      <div class="who"><span class="sync" id="sync">Connecting…</span><button class="me" id="me-btn" data-act="logout" hidden></button></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="live" id="tab-live">Live FIFA</button>
      <button role="tab" data-tab="poker" id="tab-poker">Poker</button>
      <button role="tab" data-tab="board" id="tab-board">Leaderboard</button>
      <button role="tab" data-tab="setup" id="tab-setup">Players &amp; groups</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
"use strict";
/* ---------- store: one record per player, group, buy-in, cash-out and match ---------- */
const COLS = ["players", "groups", "buyins", "cashouts", "matches", "settings"];
let D = {}; COLS.forEach(c => { D[c] = {}; });
let db = null, live = false, ready = false, access = "local"; // write | read | none | local
const Q = {}; // pending writes per record: {running, next, local}
const TYPING = {}; // records being typed into, not yet saved

function persistLocal() { try { localStorage.setItem("gamenight2", JSON.stringify(D)); } catch (e) {} }
function loadLocal() { try { const j = JSON.parse(localStorage.getItem("gamenight2") || "null"); if (j) COLS.forEach(c => { if (j[c]) D[c] = j[c]; }); } catch (e) {} }

function save(col, id, doc) { // full-record write (doc = null deletes)
  if (doc) D[col][id] = doc; else delete D[col][id];
  render();
  if (!db) { persistLocal(); return; }
  const k = col + "/" + id, e = Q[k] || (Q[k] = { running: false, next: undefined, local: undefined });
  e.next = doc; e.local = doc; pump(k, col, id);
}
async function pump(k, col, id) {
  const e = Q[k]; if (e.running) return;
  while (e.next !== undefined) {
    const doc = e.next; e.next = undefined; e.running = true;
    try { const ref = db.collection(col).doc(id); if (doc) await ref.set(JSON.parse(JSON.stringify(doc))); else await ref.delete(); }
    catch (err) { if (err && ["permission_denied", "not_granted", "invalid_argument"].includes(err.code)) access = "read";
      toast(err && (err.code === "permission_denied" || err.code === "not_granted" || err.code === "invalid_argument") ? "You can view but not edit. Ask the host to share edit access." : err && err.code === "quota_exceeded" ? "Storage is full. Clear old results in Players & groups." : "Couldn't save. Check your connection and try again."); }
    e.running = false;
  }
  delete Q[k];
}
function subscribe() {
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
    Object.keys(Q).forEach(k => { const [cc, id] = k.split("/"); if (cc !== c) return; const e = Q[k]; if (e.local) m[id] = e.local; else delete m[id]; });
    Object.keys(TYPING).forEach(k => { const [cc, id] = k.split("/"); if (cc === c && m[id]) m[id] = TYPING[k]; });
    D[c] = m; if (c === "players") ready = true; render();
  }, () => { live = false; render(); }));
}

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rows = c => Object.keys(D[c]).map(id => Object.assign({}, D[c][id], { id }));
const byAt = (a, b) => (a.at || 0) - (b.at || 0) || a.id.localeCompare(b.id);
const P = () => rows("players").sort(byAt);
const G = () => rows("groups").sort(byAt);
const player = id => D.players[id];
const nm = id => { const p = player(id); return p ? (p.name || "Unnamed") : "Removed player"; };
const groupOf = id => { const p = player(id); return p && p.group && D.groups[p.group] ? p.group : ""; };
const gname = gid => (D.groups[gid] && D.groups[gid].name) || "Group";
const DEFAULT_CHIPS = [
  { name: "White", value: 0.10, stack: 10, color: "#eef0f4" },
  { name: "Red", value: 0.20, stack: 10, color: "#e04a2f" },
  { name: "Green", value: 0.50, stack: 4, color: "#1f7a43" },
  { name: "Purple", value: 1, stack: 10, color: "#7a2142" },
  { name: "Blue", value: 5, stack: 1, color: "#24348f" }];
const settings = () => { const s = Object.assign({ currency: "$", buyIn: 20 }, D.settings.main || {});
  s.chips = Array.isArray(s.chips) && s.chips.length ? s.chips : DEFAULT_CHIPS; return s; };
const stackValue = () => settings().chips.reduce((t, c) => t + c.value * c.stack, 0);
const stackCount = () => settings().chips.reduce((t, c) => t + c.stack, 0);
const r2 = v => Math.round(v * 100) / 100;
const money = v => { const n = Math.round(v * 100) / 100; return (n < 0 ? "−" : "") + settings().currency + Math.abs(n).toFixed(n % 1 ? 2 : 0); };
const clock = t => t ? new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
const ordinal = n => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");

/* identity: pick your name, remembered on this device */
const ui = { tab: "live", armed: null, edit: null, board: "fifa", form: { a: "", b: "", teamA: "", teamB: "", stage: "group", round: "Semi-final" }, custom: {}, count: {} };
let me = null;
try { me = localStorage.getItem("gn-me"); const t = localStorage.getItem("gn-tab2"); if (t) ui.tab = t; } catch (e) {}
if (/^#(live|poker|board|setup)$/.test(location.hash)) ui.tab = location.hash.slice(1);
const setMe = id => { me = id; try { id ? localStorage.setItem("gn-me", id) : localStorage.removeItem("gn-me"); } catch (e) {} render(); };

/* poker */
const buyins = () => rows("buyins").sort(byAt);
const pokerIds = () => { const ids = P().filter(p => p.poker).map(p => p.id); buyins().forEach(b => { if (!ids.includes(b.player)) ids.push(b.player); }); return ids; };
const paidIn = id => buyins().filter(b => b.player === id).reduce((t, b) => t + (Number(b.amount) || 0), 0);
const countIn = id => buyins().filter(b => b.player === id).length;
const cashOut = id => D.cashouts[id] ? Number(D.cashouts[id].amount) : null;
function settle(list) {
  const cr = list.filter(n => n.net > 0.005).map(n => ({ id: n.id, v: n.net })).sort((a, b) => b.v - a.v);
  const dr = list.filter(n => n.net < -0.005).map(n => ({ id: n.id, v: -n.net })).sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < dr.length && j < cr.length) { const v = Math.min(dr[i].v, cr[j].v);
    out.push({ from: dr[i].id, to: cr[j].id, v }); dr[i].v -= v; cr[j].v -= v;
    if (dr[i].v < 0.005) i++; if (cr[j].v < 0.005) j++; }
  return out;
}

/* fifa */
const matches = () => rows("matches").sort(byAt);
const liveMatches = () => matches().filter(m => m.status === "live");
const doneMatches = () => matches().filter(m => m.status === "done");
const winner = m => m.ga > m.gb ? m.a : m.gb > m.ga ? m.b : (m.pens || null);
const stageLabel = m => m.stage === "group" ? (sameGroup(m) ? gname(groupOf(m.a)) : "Group stage") : m.stage === "knockout" ? (m.round || "Knockout") : "Friendly";
const sameGroup = m => groupOf(m.a) && groupOf(m.a) === groupOf(m.b);
const busy = id => liveMatches().some(m => m.a === id || m.b === id);
function table(ms, ids) {
  const t = {}; const row = id => t[id] || (t[id] = { id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
  ids.forEach(row);
  ms.forEach(m => { const A = row(m.a), B = row(m.b);
    A.p++; B.p++; A.gf += m.ga; A.ga += m.gb; B.gf += m.gb; B.ga += m.ga;
    if (m.ga > m.gb) { A.w++; B.l++; A.pts += 3; } else if (m.gb > m.ga) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; } });
  return Object.values(t).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || nm(x.id).localeCompare(nm(y.id)));
}

    <p class="small muted">Usual team fills in automatically when a match starts and can be changed per match. Players can be in both poker and FIFA.</p>
  </section>
  <section class="panel"><h2>Start over</h2><div class="row">${confirmBtn("clr-m", "Clear all FIFA results", "danger")}${confirmBtn("clr-b", "Clear all buy-ins and cash-outs", "danger")}</div></section>`;
}

/* ---------- render ---------- */
const app = document.getElementById("app");
function render() {
  const sync = document.getElementById("sync");
  sync.textContent = !ready ? "Connecting…" : live ? "Live" : "This device only";
  sync.className = "sync" + (live ? " live" : "");
  const ban = document.getElementById("banner");
  ban.hidden = !ready || !(access === "read" || access === "none");
  ban.innerHTML = access === "read" ? "<b>View only.</b> You can follow along, but what you enter won't be saved for everyone. Ask the host to invite you by email as an Editor."
    : access === "none" ? "<b>Not connected.</b> Sign in to Claude and ask the host to invite you, then reopen this page. Anything you enter now stays on this phone only." : "";
  const meBtn = document.getElementById("me-btn"), meOk = me === "guest" || (me && player(me));
  meBtn.hidden = !ready || !meOk; meBtn.textContent = me === "guest" ? "Guest · switch" : meOk ? nm(me) + " · switch" : "";
  document.getElementById("tabs").hidden = !meOk;
  document.querySelectorAll("#tabs button").forEach(b => { b.setAttribute("aria-selected", b.dataset.tab === ui.tab);
    if (b.dataset.tab === "live") b.innerHTML = "Live FIFA" + (liveMatches().length ? '<span class="dot" aria-label="matches live"></span>' : ""); });
  const ae = document.activeElement, aid = ae && ae.id, sel = ae && ae.type === "text" ? [ae.selectionStart, ae.selectionEnd] : null;
  app.innerHTML = !ready ? `<section class="panel"><p class="muted">Loading tonight's games…</p></section>` : !meOk ? viewLogin()
    : ui.tab === "poker" ? viewPoker() : ui.tab === "board" ? viewBoard() : ui.tab === "setup" ? viewSetup() : viewLive();
  if (aid) { const el = document.getElementById(aid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

/* ---------- actions ---------- */
const by = () => me || "guest";
const timers = {};
const later = (key, fn) => { clearTimeout(timers[key]); timers[key] = setTimeout(fn, 500); };
function setTab(t) { ui.tab = t; ui.edit = null; try { localStorage.setItem("gn-tab2", t); } catch (e) {} render(); window.scrollTo(0, 0); }
const newPlayer = name => ({ name, team: "", group: "", poker: false, fifa: false, at: Date.now() });
const upd = (col, id, patch) => { const cur = D[col][id]; if (cur) save(col, id, Object.assign({}, cur, patch)); };

const ACT = {
  login: d => setMe(d.id),
  logout: () => setMe(null),
  board: d => { ui.board = d.v; render(); },
  kickoff: () => { const f = ui.form; if (!f.a || !f.b || f.a === f.b) return;
    save("matches", uid(), { a: f.a, b: f.b, teamA: f.teamA.trim(), teamB: f.teamB.trim(), ga: 0, gb: 0, status: "live", stage: f.stage, round: f.stage === "knockout" ? f.round : "", pens: null, at: Date.now(), by: by() });
    ui.form = Object.assign({}, f, { a: "", b: "", teamA: "", teamB: "" }); render(); toast("Kicked off"); },
  goal: d => { const m = D.matches[d.id]; if (!m) return; const k = d.side === "a" ? "ga" : "gb"; const v = Math.max(0, m[k] + Number(d.d));
    const patch = { [k]: v }; const ga = k === "ga" ? v : m.ga, gb = k === "gb" ? v : m.gb; if (ga !== gb) patch.pens = null; upd("matches", d.id, patch); },
  pens: d => upd("matches", d.id, { pens: d.w }),
  ft: d => { const m = D.matches[d.id]; if (!m || (m.stage === "knockout" && m.ga === m.gb && !m.pens)) return;
    upd("matches", d.id, { status: "done", endedAt: Date.now(), doneBy: by() }); const w = winner(D.matches[d.id]); toast(w ? nm(w) + " wins" : "Draw recorded"); },
  edit: d => { ui.edit = ui.edit === d.id ? null : d.id; render(); },
  doneedit: () => { ui.edit = null; render(); toast("Result saved"); },
  buyin: d => { const s = settings(); save("buyins", uid(), { player: d.id, amount: s.buyIn, at: Date.now(), by: by() });
    toast("Give " + nm(d.id) + ": " + s.chips.filter(c => c.stack).map(c => c.stack + " " + c.name.toLowerCase()).join(", ")); },
  count: d => { if (ui.count[d.id]) delete ui.count[d.id]; else { const prev = D.cashouts[d.id] && D.cashouts[d.id].counts; ui.count[d.id] = Array.isArray(prev) ? prev.slice() : []; } render(); },
  usecount: d => { const chips = settings().chips, cnt = ui.count[d.id] || [];
    const amount = r2(chips.reduce((t, c, i) => t + c.value * (Number(cnt[i]) || 0), 0));
    save("cashouts", d.id, { amount, counts: chips.map((c, i) => Number(cnt[i]) || 0), at: Date.now(), by: by() }); delete ui.count[d.id]; render(); toast(nm(d.id) + " cashes out " + money(amount)); },
  custom: d => { ui.custom[d.id] = { v: "" }; render(); const el = document.getElementById("cu-" + d.id); el && el.focus(); },
  addcustom: d => { const v = Number((ui.custom[d.id] || {}).v); delete ui.custom[d.id];
    if (v > 0) save("buyins", uid(), { player: d.id, amount: v, at: Date.now(), by: by() }); else render(); },
  seat: () => { const el = document.getElementById("addp"); if (el && el.value) upd("players", el.value, { poker: true }); },
  addp: () => { const id = uid(); save("players", id, newPlayer("")); const el = document.getElementById("pn-" + id); el && el.focus(); },
  rmp: d => save("players", d.id, null),
  tog: d => { const p = D.players[d.id]; if (p) upd("players", d.id, { [d.k]: !p[d.k] }); },
  addgroup: () => { const id = uid(); save("groups", id, { name: "Group " + String.fromCharCode(65 + G().length % 26), at: Date.now() }); },
  rmgroup: d => { save("groups", d.id, null); P().filter(p => p.group === d.id).forEach(p => upd("players", p.id, { group: "" })); },
  confirm: d => { const k = d.key;
    if (ui.armed !== k) { ui.armed = k; render(); clearTimeout(ACT._t); ACT._t = setTimeout(() => { ui.armed = null; render(); }, 3000); return; }
    ui.armed = null; clearTimeout(ACT._t);
    if (k.startsWith("delm-")) { save("matches", k.slice(5), null); ui.edit = null; toast("Match removed"); }
    else if (k.startsWith("delb-")) { save("buyins", k.slice(5), null); }
    else if (k.startsWith("undo-")) { const id = k.slice(5), last = buyins().filter(b => b.player === id).pop(); if (last) save("buyins", last.id, null); toast("Last buy-in removed"); }
    else if (k === "clr-m") { Object.keys(D.matches).forEach(id => save("matches", id, null)); toast("FIFA results cleared"); }
    else if (k === "clr-b") { Object.keys(D.buyins).forEach(id => save("buyins", id, null)); Object.keys(D.cashouts).forEach(id => save("cashouts", id, null)); toast("Buy-ins cleared"); }
    else render(); }
};

document.addEventListener("click", e => {
  const tab = e.target.closest("#tabs button"); if (tab) return setTab(tab.dataset.tab);
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset);
});
document.addEventListener("submit", e => { if (e.target.id !== "join") return; e.preventDefault();
  const name = document.getElementById("join-name").value.trim().slice(0, 30); if (!name) return;
  const existing = P().find(p => (p.name || "").toLowerCase() === name.toLowerCase());
  if (existing) return setMe(existing.id);
  const id = uid(); save("players", id, newPlayer(name)); setMe(id); });
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.input, id = el.dataset.id; if (!k) return;
  if (k === "form") { const f = ui.form, key = el.dataset.k; f[key] = el.value;
    if (key === "a" || key === "b") { const p = player(el.value); f[key === "a" ? "teamA" : "teamB"] = p && p.team ? p.team : ""; }
    if (el.tagName === "SELECT") render(); return; }
  if (k === "custom") { ui.custom[id] = { v: el.value }; return; }
  if (k === "cnt") { const i = Number(el.dataset.i), chips = settings().chips, cnt = ui.count[id]; if (!cnt) return; cnt[i] = el.value;
    const sub = document.getElementById("ns-" + id + "-" + i); if (sub) sub.textContent = money(chips[i].value * (Number(el.value) || 0));
    const tot = document.getElementById("ct-" + id); if (tot) tot.textContent = money(r2(chips.reduce((t, c, j) => t + c.value * (Number(cnt[j]) || 0), 0))); return; }
  if (k === "chipset") { const i = Number(el.dataset.i), key = el.dataset.k, v = Number(el.value); if (!(v >= 0) || el.value === "") return;
    later("chip" + i + key, () => { const s = settings(); const chips = s.chips.map((c, j) => j === i ? Object.assign({}, c, { [key]: v }) : c);
      save("settings", "main", Object.assign({}, s, { chips })); }); return; }
  if (k === "pname" || k === "pteam" || k === "gname") { const col = k === "gname" ? "groups" : "players", field = k === "pteam" ? "team" : "name";
    const cur = D[col][id]; if (!cur) return; const key = col + "/" + id; D[col][id] = TYPING[key] = Object.assign({}, cur, { [field]: el.value.slice(0, 30) });
    later(k + id, () => { const doc = TYPING[key]; delete TYPING[key]; if (D[col][id]) save(col, id, doc); }); return; }
  if (k === "cashout") { later("co" + id, () => { const v = el.value.trim(); save("cashouts", id, v === "" ? null : { amount: Math.max(0, Number(v)), at: Date.now(), by: by() }); }); return; }
  if (k === "setting") { const key = el.dataset.k; later("set" + key, () => { const s = settings(); const v = key === "currency" ? el.value.slice(0, 3) : Number(el.value);
    if (key !== "currency" && !(v > 0)) return; save("settings", "main", Object.assign({}, s, { [key]: v })); }); }
});
document.addEventListener("change", e => { const el = e.target;
  if (el.dataset.input === "pgroup") upd("players", el.dataset.id, { group: el.value }); });

/* ---------- boot ---------- */
render();
if (window.claude && typeof window.claude.use === "function") {
  Promise.all([window.claude.use("db"), window.claude.use("user").catch(() => null)]).then(async ([d, u]) => {
    if (d) { db = d; live = true; let can = null; try { can = u ? await u.can("data.write") : null; } catch (e) {}
      access = can === false ? "read" : "write"; subscribe(); setTimeout(() => { if (!ready) { ready = true; render(); } }, 4000); }
    else { access = "none"; ready = true; loadLocal(); }
    render(); }).catch(() => { access = "none"; ready = true; loadLocal(); render(); });
} else { ready = true; loadLocal(); render(); }
})();
</script>
