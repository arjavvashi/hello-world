<title>Game Night Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: sticky scoreboard header + tab bar, one column of panels; Poker = felt green, FIFA = floodlight blue */
:root{
  --bg:#eceeea; --surface:#ffffff; --sunk:#f4f5f2; --ink:#141a19; --muted:#5b6662; --line:#d3d9d4;
  --felt:#16694a; --felt-deep:#0f4f37; --on-felt:#f3fbf6; --pitch:#2f4fd6; --red:#bf3527; --gold:#b9861a; --ok:#1d7a4c;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1211; --surface:#171d1c; --sunk:#121716; --ink:#e7ece9; --muted:#93a19b; --line:#2b3432;
  --felt:#1f8a60; --felt-deep:#14583e; --on-felt:#f3fbf6; --pitch:#8293ff; --red:#ef6b5b; --gold:#e3b04a; --ok:#4fc78b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1211; --surface:#171d1c; --sunk:#121716; --ink:#e7ece9; --muted:#93a19b; --line:#2b3432;
  --felt:#1f8a60; --felt-deep:#14583e; --on-felt:#f3fbf6; --pitch:#8293ff; --red:#ef6b5b; --gold:#e3b04a; --ok:#4fc78b; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
table{font:inherit;color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:0 48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--red);font-weight:800}
.sync{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.live{color:var(--ok);border-color:currentColor}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}

main{display:grid;gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;line-height:1.1;text-wrap:balance;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.tag{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.poker{color:var(--felt);border-color:currentColor;background:none}
.tag.fifa{color:var(--pitch);border-color:currentColor;background:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.felt{background:var(--felt);color:var(--on-felt);border-color:var(--felt)}
.btn.pitch{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{width:36px;height:36px;border:0;background:var(--sunk);font-size:18px;font-weight:700;cursor:pointer}
.step span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;min-height:40px;min-width:0}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

/* blind clock */
.clock{background:var(--felt-deep);color:var(--on-felt);border-radius:var(--r);padding:16px;display:grid;gap:6px;text-align:center}
.clock .lvl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.clock .time{font-family:var(--display);font-weight:800;font-size:clamp(64px,18vw,112px);line-height:.9;font-variant-numeric:tabular-nums}
.clock .blinds{font-family:var(--display);font-weight:600;font-size:30px;line-height:1}
.clock .next{font-size:13px;opacity:.8}
.clock.paused .time{opacity:.55}
.clock .row{justify-content:center}
.clock .btn{background:transparent;color:var(--on-felt);border-color:rgba(255,255,255,.35)}
.clock .btn.go{background:var(--on-felt);color:var(--felt-deep);border-color:var(--on-felt)}

/* table */
.table-wrap{position:relative;width:100%;max-width:520px;margin:8px auto 4px;aspect-ratio:1.9;}
.felt{position:absolute;inset:16% 10%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt-deep));border:6px solid #5b3b22;display:grid;place-items:center;color:var(--on-felt);text-align:center}
.felt .pot{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.felt .potl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.seat{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:700;font-size:13px;max-width:30%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.seat.out{opacity:.4;text-decoration:line-through}
.seat .d{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center;text-decoration:none}

.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .name{flex:1 1 120px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.li.out .name{color:var(--muted);text-decoration:line-through}
.place{font-family:var(--display);font-weight:800;font-size:20px;min-width:34px}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--red)}

/* fifa */
.pitchcard{border-radius:var(--r);padding:16px;background:var(--sunk);border:1px solid var(--line);display:grid;gap:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .pl{font-weight:700;overflow-wrap:anywhere;min-width:0}
.vs .pl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.score.sm{font-size:28px}
.vs .step{margin-top:6px}
.stage{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pitch);text-align:center}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td:nth-child(2){font-weight:700}
.tbl tr.q td:first-child{color:var(--pitch);font-weight:800}
.mrow{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .a{text-align:right;font-weight:600;overflow-wrap:anywhere;min-width:0}
.mrow .b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mrow .s{font-variant-numeric:tabular-nums;font-weight:800;min-width:48px;text-align:center}
.mrow .w{color:var(--ink)} .mrow .l{color:var(--muted);font-weight:400}
.mrow.now{background:color-mix(in srgb,var(--pitch) 10%,transparent);border-radius:6px}
.champ{font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);text-transform:uppercase;text-align:center;line-height:1.1}
details summary{cursor:pointer;font-weight:700;padding:4px 0}

.toggle{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:34px;color:var(--muted)}
.toggle.on.p{background:var(--felt);border-color:var(--felt);color:var(--on-felt)}
.toggle.on.f{background:var(--pitch);border-color:var(--pitch);color:#fff}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;width:32px;height:32px}
@media (max-width:560px){
  .prow{grid-template-columns:minmax(0,1fr) auto auto auto}
  .prow .team{grid-column:1/-1;grid-row:2}
}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px;font-size:14px}
.notice.warn{border-color:var(--gold)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:12px;justify-items:center}
.empty .big{font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.clock.ending .time{animation:pulse 1s infinite}}
@keyframes pulse{50%{opacity:.5}}
</style>

<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand">Game <b>♠︎</b> Night</div>
      <span class="sync" id="sync">Connecting…</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="tonight" id="tab-tonight">Tonight</button>
      <button role="tab" data-tab="poker" id="tab-poker">Poker</button>
      <button role="tab" data-tab="fifa" id="tab-fifa">FIFA</button>
      <button role="tab" data-tab="players" id="tab-players">Players</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
"use strict";
/* ---------- state ---------- */
const DOCS = ["players", "poker", "fifa"];
const DEF = {
  players: () => ({ list: [] }),
  poker: () => ({ mode: "tournament", currency: "$", buyIn: 20, chips: 10000, payout: "65/35",
    seats: [], dealer: 0, entries: {}, bust: [],
    timer: { running: false, startedAt: 0, elapsed: 0, minutes: 15 } }),
  fifa: () => ({ legs: 1, playoff: "semis", minutes: 12, matches: [], roster: [] })
};
let S = { players: DEF.players(), poker: DEF.poker(), fifa: DEF.fifa() };
let db = null, live = false, ready = false;
const inflight = {}, dirty = {}, soon = {};
const ui = { tab: "tonight", openMatch: null, armed: null };

try { const t = localStorage.getItem("gn-tab"); if (t) ui.tab = t; } catch (e) {}
if (/^#(tonight|poker|fifa|players)$/.test(location.hash)) ui.tab = location.hash.slice(1);

function normalize(k, d) { const base = DEF[k](); const o = Object.assign(base, d || {});
  if (k === "poker") o.timer = Object.assign(DEF.poker().timer, (d && d.timer) || {});
  return o; }
function loadLocal() { try { const j = JSON.parse(localStorage.getItem("gamenight") || "null");
  if (j) DOCS.forEach(k => { if (j[k]) S[k] = normalize(k, j[k]); }); } catch (e) {} }
function saveLocal() { try { localStorage.setItem("gamenight", JSON.stringify(S)); } catch (e) {} }

async function commit(k) {
  clearTimeout(soon[k]); soon[k] = null;
  render();
  if (!db) { saveLocal(); return; }
  dirty[k] = true;
  if (inflight[k]) return;
  while (dirty[k]) {
    dirty[k] = false; inflight[k] = true;
    try { await db.doc("night/" + k).set(JSON.parse(JSON.stringify(S[k]))); }
    catch (e) { toast(e && e.code === "permission_denied" ? "You can view but not edit. Ask the host for edit access." : "Couldn't save. Check your connection."); }
    inflight[k] = false;
  }
}
function commitSoon(k) { clearTimeout(soon[k]); soon[k] = setTimeout(() => commit(k), 500); }

function subscribe() {
  DOCS.forEach(k => {
    db.doc("night/" + k).onSnapshot(snap => {
      if (inflight[k] || dirty[k] || soon[k]) return;
      S[k] = normalize(k, snap.exists ? snap.data() : null);
      render();
    }, () => { live = false; render(); });
  });
}

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const P = () => S.players.list;
const byId = id => P().find(p => p.id === id);
const nm = id => { const p = byId(id); return p ? (p.name || "Unnamed") : "Removed player"; };
const team = id => { const p = byId(id); return p && p.team ? p.team : ""; };
const money = v => { const c = S.poker.currency || ""; const n = Math.round(v * 100) / 100;
  const s = Math.abs(n).toFixed(n % 1 ? 2 : 0); return (n < 0 ? "−" : "") + c + s; };

/* poker */
const pokerIds = () => P().filter(p => p.poker).map(p => p.id);
function seatOrder() { const ids = pokerIds(); const s = S.poker.seats.filter(i => ids.includes(i));
  ids.forEach(i => { if (!s.includes(i)) s.push(i); }); return s; }
const entry = id => Object.assign({ buyIns: 1, cashOut: null }, S.poker.entries[id] || {});
const busted = () => S.poker.bust.filter(i => pokerIds().includes(i));
const alive = () => seatOrder().filter(i => !busted().includes(i));
const pot = () => seatOrder().reduce((t, i) => t + entry(i).buyIns * S.poker.buyIn, 0);
const split = () => S.poker.payout.split("/").map(Number);
function niceBase(chips) { const x = chips / 200; const c = [1, 2, 5, 10, 25, 50, 100, 200, 250, 500, 1000, 2500, 5000];
  let b = 1; c.forEach(v => { if (v <= x) b = v; }); return b; }
const MULT = [1, 2, 3, 4, 6, 8, 10, 15, 20, 30, 40, 60, 80, 100, 150, 200];
function blinds(l) { const b = niceBase(S.poker.chips); const m = l < MULT.length ? MULT[l] : MULT[MULT.length - 1] * Math.pow(1.5, l - MULT.length + 1);
  const sb = Math.round(m * b / b) * b; return [sb, sb * 2]; }
const levelMs = () => Math.max(1, S.poker.timer.minutes) * 60000;
const tElapsed = () => { const t = S.poker.timer; return t.elapsed + (t.running ? Math.max(0, Date.now() - t.startedAt) : 0); };
const fmtT = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fmtN = n => n.toLocaleString();

function places() { // id -> place (1 = winner), only for decided spots
  const seats = seatOrder(), b = busted(), out = {}; const n = seats.length;
  b.forEach((id, j) => { out[id] = n - j; });
  const a = alive(); if (a.length === 1 && n > 1) out[a[0]] = 1;
  return out; }
function nets() { // [{id, net}] or null when not settled yet
  const seats = seatOrder(); if (!seats.length) return null;
  const pk = S.poker;
  if (pk.mode === "cash") {
    if (seats.some(i => entry(i).cashOut == null || entry(i).cashOut === "")) return null;
    const val = pk.buyIn / pk.chips;
    return seats.map(i => ({ id: i, net: Number(entry(i).cashOut) * val - entry(i).buyIns * pk.buyIn }));
  }
  if (alive().length > 1) return null;
  const pl = places(), sp = split(), pool = pot();
  return seats.map(i => ({ id: i, net: (sp[pl[i] - 1] ? pool * sp[pl[i] - 1] / 100 : 0) - entry(i).buyIns * pk.buyIn }));
}
function settle(list) {
  const cr = list.filter(n => n.net > 0.005).map(n => ({ id: n.id, v: n.net })).sort((a, b) => b.v - a.v);
  const dr = list.filter(n => n.net < -0.005).map(n => ({ id: n.id, v: -n.net })).sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < dr.length && j < cr.length) { const v = Math.min(dr[i].v, cr[j].v);
    out.push({ from: dr[i].id, to: cr[j].id, v }); dr[i].v -= v; cr[j].v -= v;
    if (dr[i].v < 0.005) i++; if (cr[j].v < 0.005) j++; }
  return out; }

/* fifa */
const fifaIds = () => P().filter(p => p.fifa).map(p => p.id);
function roundRobin(ids, legs) {
  const a = shuffle(ids); if (a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for (let r = 0; r < n - 1; r++) { const ms = [];
    for (let i = 0; i < n / 2; i++) { const x = a[i], y = a[n - 1 - i]; if (x && y) ms.push(r % 2 ? [y, x] : [x, y]); }
    rounds.push(ms); a.splice(1, 0, a.pop()); }
  let all = rounds.flat(); if (legs === 2) all = all.concat(rounds.flat().map(([x, y]) => [y, x]));
  // order so nobody plays twice in a row and games stay even
  const left = all.slice(), out = [], played = {}; let prev = [];
  while (left.length) { let best = 0, sc = Infinity;
    left.forEach((m, i) => { const s = (prev.includes(m[0]) || prev.includes(m[1]) ? 1000 : 0) + (played[m[0]] || 0) + (played[m[1]] || 0) + i * 0.001;
      if (s < sc) { sc = s; best = i; } });
    const m = left.splice(best, 1)[0]; out.push(m); played[m[0]] = (played[m[0]] || 0) + 1; played[m[1]] = (played[m[1]] || 0) + 1; prev = m; }
  return out.map(([x, y]) => ({ id: uid(), stage: "league", a: x, b: y, ga: 0, gb: 0, done: false, pens: null }));
}
const M = () => S.fifa.matches;
function standings() {
  const t = {}; S.fifa.roster.forEach(id => { t[id] = { id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
  M().filter(m => m.stage === "league" && m.done).forEach(m => {
    const A = t[m.a], B = t[m.b]; if (!A || !B) return;
    A.p++; B.p++; A.gf += m.ga; A.ga += m.gb; B.gf += m.gb; B.ga += m.ga;
    if (m.ga > m.gb) { A.w++; B.l++; A.pts += 3; } else if (m.gb > m.ga) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; } });
  return Object.values(t).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || nm(x.id).localeCompare(nm(y.id)));
}
const winner = m => m.ga > m.gb ? m.a : m.gb > m.ga ? m.b : m.pens;
const loser = m => winner(m) === m.a ? m.b : m.a;
const current = () => M().find(m => !m.done);
function champion() {
  const f = M().find(m => m.stage === "final" && m.done); if (f) return winner(f);
  const L = M().filter(m => m.stage === "league");
  if (S.fifa.playoff === "none" && L.length && L.every(m => m.done)) return standings()[0].id;
  return null; }
function advance() {
  const f = S.fifa, L = M().filter(m => m.stage === "league");
  if (!L.length || !L.every(m => m.done)) return;
  const st = standings(), add = (stage, a, b) => f.matches.push({ id: uid(), stage, a, b, ga: 0, gb: 0, done: false, pens: null });
  const has = s => M().some(m => m.stage === s);
  if (f.playoff === "semis" && st.length >= 4 && !has("semi")) { add("semi", st[0].id, st[3].id); add("semi", st[1].id, st[2].id); }
  if (f.playoff === "final" && st.length >= 2 && !has("final")) add("final", st[0].id, st[1].id);
  const se = M().filter(m => m.stage === "semi");
  if (se.length === 2 && se.every(m => m.done) && !has("final")) add("final", winner(se[0]), winner(se[1]));
}
const stageName = m => m.stage === "league" ? "League" : m.stage === "semi" ? "Semi-final" : "Final";
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

/* ---------- views ---------- */
function confirmBtn(key, label, cls) { const on = ui.armed === key;
  return `<button class="btn ${cls || ""} ${on ? "armed" : ""}" data-act="confirm" data-key="${key}" id="c-${key}">${on ? "Tap again to confirm" : label}</button>`; }

function clockHTML(compact) {
  const pk = S.poker, el = tElapsed(), lm = levelMs(), lvl = Math.floor(el / lm), rem = lm - (el % lm);
  const [sb, bb] = blinds(lvl), [ns, nb] = blinds(lvl + 1);
  const ending = pk.timer.running && rem < 60000;
  return `<div class="clock ${pk.timer.running ? "" : "paused"} ${ending ? "ending" : ""}" data-clock>
    <div class="lvl" data-lvl>Level ${lvl + 1}${pk.timer.running ? "" : el ? " · paused" : " · not started"}</div>
    <div class="time" data-time>${fmtT(rem)}</div>
    <div class="blinds num" data-blinds>${fmtN(sb)} / ${fmtN(bb)}</div>
    <div class="next" data-next>Next: ${fmtN(ns)} / ${fmtN(nb)}</div>
    ${compact ? "" : `<div class="row" style="margin-top:8px">
      <button class="btn" data-act="lvl-prev" id="lvl-prev" aria-label="Previous level">◀ Level</button>
      <button class="btn go" data-act="timer" id="timer-go">${pk.timer.running ? "Pause" : el ? "Resume" : "Start clock"}</button>
      <button class="btn" data-act="lvl-next" id="lvl-next" aria-label="Next level">Level ▶</button>
    </div>`}
  </div>`;
}

function tableHTML() {
  const seats = seatOrder(); if (!seats.length) return "";
  const b = busted(), n = seats.length, d = seats[S.poker.dealer % n];
  const pos = seats.map((id, i) => { const ang = Math.PI / 2 + (i / n) * Math.PI * 2;
    return `<div class="seat ${b.includes(id) ? "out" : ""}" style="left:${50 + 44 * Math.cos(ang)}%;top:${50 + 42 * Math.sin(ang)}%">${id === d ? '<span class="d" title="Dealer">D</span>' : ""}${esc(nm(id))}</div>`; }).join("");
  return `<div class="table-wrap"><div class="felt"><div><div class="pot">${money(pot())}</div><div class="potl">${S.poker.mode === "cash" ? "bought in" : "prize pool"}</div></div></div>${pos}</div>`;
}

function emptyPlayers() {
  return `<section class="panel"><div class="empty">
    <div class="big">Who's playing?</div>
    <p class="muted" style="margin:0;max-width:40ch">Add tonight's players, then split them between the poker table and the FIFA tournament.</p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" data-act="go" data-tab="players" id="e-add">Add players</button>
      <button class="btn" data-act="quickfill" id="e-fill">Use Player 1–12</button>
    </div></div></section>`;
}

function viewTonight() {
  if (!P().length) return emptyPlayers();
  const seats = seatOrder(), a = alive(), cur = current(), ch = champion();
  const st = S.fifa.roster.length ? standings() : [];
  const next = M().filter(m => !m.done).slice(1, 3);
  const pl = places(); const winnerId = a.length === 1 && seats.length > 1 && S.poker.mode === "tournament" ? a[0] : null;
  return `<div class="grid2">
  <section class="panel"><h2>Poker <span class="tag poker">${seats.length} seats</span></h2>
    ${seats.length ? clockHTML(true) : `<p class="muted">Nobody is marked for poker yet.</p>`}
    ${seats.length ? `<div class="spread" style="margin-top:12px"><span><b class="num">${S.poker.mode === "cash" ? seats.length : a.length}</b> <span class="muted">${S.poker.mode === "cash" ? "at the table" : "of " + seats.length + " still in"}</span></span><span><span class="muted">${S.poker.mode === "cash" ? "In play" : "Pool"}</span> <b class="money">${money(pot())}</b></span></div>` : ""}
    ${winnerId ? `<div class="champ" style="margin-top:12px">${esc(nm(winnerId))} wins</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="btn" data-act="go" data-tab="poker" id="t-poker">Open table</button></div>
  </section>
  <section class="panel"><h2>FIFA <span class="tag fifa">${S.fifa.roster.length} players</span></h2>
    ${!M().length ? `<p class="muted">No schedule yet. Generate one in the FIFA tab.</p>` : ""}
    ${ch ? `<div class="champ">🏆︎ ${esc(nm(ch))}</div><p class="muted small" style="text-align:center;margin:4px 0 0">Tournament champion</p>` : ""}
    ${cur ? `<div class="pitchcard"><div class="stage">On now · ${stageName(cur)}</div>
      <div class="vs"><div class="pl">${esc(nm(cur.a))}<small>${esc(team(cur.a))}</small></div><div class="score">${cur.ga}–${cur.gb}</div><div class="pl">${esc(nm(cur.b))}<small>${esc(team(cur.b))}</small></div></div></div>` : ""}
    ${next.length ? `<h3>Up next</h3><div class="list">${next.map(m => `<div class="li"><span class="name">${esc(nm(m.a))} <span class="muted">v</span> ${esc(nm(m.b))}</span><span class="muted small">${stageName(m)}</span></div>`).join("")}</div>` : ""}
    ${st.length && st[0].p ? `<h3>Top of the table</h3><div class="list">${st.slice(0, 3).map((r, i) => `<div class="li"><span class="place">${i + 1}</span><span class="name">${esc(nm(r.id))}</span><b class="num">${r.pts} pts</b></div>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="btn" data-act="go" data-tab="fifa" id="t-fifa">Open tournament</button></div>
  </section></div>`;
}

function viewPoker() {
  if (!P().length) return emptyPlayers();
  const pk = S.poker, seats = seatOrder(), b = busted(), a = alive(), cash = pk.mode === "cash";
  if (!seats.length) return `<section class="panel"><h2>Poker</h2><p class="muted">Mark who's at the table in the Players tab.</p><button class="btn" data-act="go" data-tab="players" id="p-go">Go to Players</button></section>`;
  const pl = places(), sp = split(), pool = pot(), ns = nets();
  const chipTotal = seats.reduce((t, i) => t + entry(i).buyIns * pk.chips, 0);
  const counted = seats.reduce((t, i) => t + (Number(entry(i).cashOut) || 0), 0);
  const rows = seats.map(id => { const e = entry(id), out = b.includes(id);
    return `<div class="li ${out ? "out" : ""}">
      ${!cash ? `<span class="place">${pl[id] ? ordinal(pl[id]) : ""}</span>` : ""}
      <span class="name">${esc(nm(id))}</span>
      <span class="row small"><span class="muted">Buy-ins</span><span class="step"><button data-act="buyin" data-id="${id}" data-d="-1" aria-label="Remove buy-in">−</button><span>${e.buyIns}</span><button data-act="buyin" data-id="${id}" data-d="1" aria-label="Add buy-in">+</button></span></span>
      ${cash ? `<input type="number" inputmode="numeric" min="0" placeholder="Chips at end" id="co-${id}" data-input="cashout" data-id="${id}" value="${e.cashOut == null ? "" : esc(e.cashOut)}" style="width:130px">`
        : out ? `<button class="btn sm" data-act="unbust" data-id="${id}" id="ub-${id}">Undo bust</button>`
        : a.length > 1 ? `<button class="btn sm danger" data-act="bust" data-id="${id}" id="bu-${id}">Busted</button>` : `<span class="tag poker">Winner</span>`}
    </div>`; }).join("");
  const results = ns ? `<h3>Results</h3><div class="list">${ns.slice().sort((x, y) => y.net - x.net).map(n => `<div class="li"><span class="name">${esc(nm(n.id))}</span><span class="money ${n.net > 0.005 ? "pos" : n.net < -0.005 ? "neg" : ""}">${n.net > 0.005 ? "+" : ""}${money(n.net)}</span></div>`).join("")}</div>
    <h3>Settle up</h3>${(() => { const s = settle(ns); return s.length ? `<div class="list">${s.map(t => `<div class="li"><span class="name">${esc(nm(t.from))} <span class="muted">pays</span> ${esc(nm(t.to))}</span><b class="money">${money(t.v)}</b></div>`).join("")}</div>` : `<p class="muted">Everyone's square.</p>`; })()}` : "";
  return `
  <section class="panel"><h2>Blind clock <span class="tag poker">${pk.timer.minutes} min levels</span></h2>${clockHTML(false)}
    <div class="row small muted" style="margin-top:10px;justify-content:center">Starting stack ${fmtN(pk.chips)} · blinds rise every ${pk.timer.minutes} min</div>
  </section>
  <section class="panel"><h2>The table <span class="tag poker">${cash ? "Cash game" : a.length + " of " + seats.length + " left"}</span></h2>
    ${tableHTML()}
    <div class="row" style="justify-content:center;margin-bottom:8px">
      <button class="btn" data-act="dealer" id="p-dealer">Move dealer button</button>
      <button class="btn" data-act="seats" id="p-seats">Shuffle seats</button>
    </div>
    <div class="list">${rows}</div>
    ${cash ? `<p class="small ${counted && counted !== chipTotal ? "neg" : "muted"}">Chips counted ${fmtN(counted)} of ${fmtN(chipTotal)} issued${counted && counted !== chipTotal ? " — recount before settling" : ""}. 1 chip = ${money(pk.buyIn / pk.chips)}.</p>`
      : `<p class="small muted">Payouts: ${sp.map((p, i) => `${ordinal(i + 1)} ${money(pool * p / 100)}`).join(" · ")}</p>`}
    ${results}
  </section>
  <section class="panel"><h2>Game settings</h2>
    <div class="fields">
      <label class="f">Format<select id="pk-mode" data-input="pk" data-k="mode"><option value="tournament" ${pk.mode === "tournament" ? "selected" : ""}>Tournament</option><option value="cash" ${cash ? "selected" : ""}>Cash game</option></select></label>
      <label class="f">Currency<input type="text" id="pk-cur" data-input="pk" data-k="currency" value="${esc(pk.currency)}" maxlength="3"></label>
      <label class="f">Buy-in<input type="number" inputmode="decimal" min="0" id="pk-buy" data-input="pk" data-k="buyIn" value="${pk.buyIn}"></label>
      <label class="f">Starting chips<input type="number" inputmode="numeric" min="100" step="100" id="pk-chips" data-input="pk" data-k="chips" value="${pk.chips}"></label>
      <label class="f">Level length<select id="pk-min" data-input="pkmin">${[10, 12, 15, 20, 25, 30].map(v => `<option value="${v}" ${pk.timer.minutes === v ? "selected" : ""}>${v} min</option>`).join("")}</select></label>
      ${!cash ? `<label class="f">Payouts<select id="pk-pay" data-input="pk" data-k="payout">${["100", "65/35", "50/30/20"].map(v => `<option value="${v}" ${pk.payout === v ? "selected" : ""}>${v === "100" ? "Winner takes all" : v.split("/").map(x => x + "%").join(" / ")}</option>`).join("")}</select></label>` : ""}
    </div>
    <div class="row" style="margin-top:16px">${confirmBtn("reset-timer", "Reset clock", "")}${confirmBtn("reset-poker", "Reset poker game", "danger")}</div>
  </section>`;
}
const ordinal = n => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");

function stepper(m, side) { const v = side === "a" ? m.ga : m.gb;
  return `<span class="step"><button data-act="goal" data-id="${m.id}" data-side="${side}" data-d="-1" aria-label="Remove goal">−</button><span>${v}</span><button data-act="goal" data-id="${m.id}" data-side="${side}" data-d="1" aria-label="Add goal">+</button></span>`; }
function matchEditor(m) {
  const ko = m.stage !== "league", tie = m.ga === m.gb;
  return `<div class="pitchcard"><div class="stage">${m.done ? "Full time" : "On the pitch"} · ${stageName(m)}</div>
    <div class="vs"><div class="pl">${esc(nm(m.a))}<small>${esc(team(m.a))}</small>${m.done ? "" : stepper(m, "a")}</div>
      <div class="score">${m.ga}–${m.gb}</div>
      <div class="pl">${esc(nm(m.b))}<small>${esc(team(m.b))}</small>${m.done ? "" : stepper(m, "b")}</div></div>
    ${ko && tie && !m.done ? `<div class="row" style="justify-content:center"><span class="small muted">Penalties won by</span>
      <button class="toggle ${m.pens === m.a ? "on f" : ""}" data-act="pens" data-id="${m.id}" data-w="${m.a}" id="pa-${m.id}">${esc(nm(m.a))}</button>
      <button class="toggle ${m.pens === m.b ? "on f" : ""}" data-act="pens" data-id="${m.id}" data-w="${m.b}" id="pb-${m.id}">${esc(nm(m.b))}</button></div>` : ""}
    ${ko && tie && m.done && m.pens ? `<div class="small muted" style="text-align:center">${esc(nm(m.pens))} won on penalties</div>` : ""}
    <div class="row" style="justify-content:center">${m.done ? `<button class="btn sm" data-act="reopen" data-id="${m.id}" id="ro-${m.id}">Edit score</button>`
      : `<button class="btn pitch" data-act="ft" data-id="${m.id}" id="ft-${m.id}" ${ko && tie && !m.pens ? "disabled" : ""}>Full time</button>`}</div>
  </div>`; }
function mrow(m, cur) { const w = m.done ? winner(m) : null;
  const c = id => w ? (id === w ? "w" : "l") : "";
  return `<div class="mrow ${cur ? "now" : ""}"><span class="a ${c(m.a)}">${esc(nm(m.a))}</span><span class="s">${m.done ? m.ga + "–" + m.gb + (m.ga === m.gb && m.pens ? "*" : "") : cur ? "LIVE" : "v"}</span><span class="b ${c(m.b)}">${esc(nm(m.b))}</span>
    <button class="btn sm" data-act="open" data-id="${m.id}" id="om-${m.id}">${ui.openMatch === m.id ? "Close" : m.done ? "Edit" : "Score"}</button></div>
    ${ui.openMatch === m.id && !cur ? matchEditor(m) : ""}`; }

function viewFifa() {
  if (!P().length) return emptyPlayers();
  const f = S.fifa, ids = fifaIds(), cur = current(), ch = champion();
  const L = M().filter(m => m.stage === "league"), KO = M().filter(m => m.stage !== "league");
  const changed = M().length && !sameSet(ids, f.roster);
  const n = ids.length, games = (n * (n - 1) / 2) * f.legs + (f.playoff === "semis" ? 3 : f.playoff === "final" ? 1 : 0);
  const setup = `<section class="panel"><h2>Tournament setup <span class="tag fifa">${n} players</span></h2>
    <div class="fields">
      <label class="f">League<select id="ff-legs" data-input="ff" data-k="legs"><option value="1" ${f.legs === 1 ? "selected" : ""}>Play everyone once</option><option value="2" ${f.legs === 2 ? "selected" : ""}>Home and away</option></select></label>
      <label class="f">Playoffs<select id="ff-po" data-input="ff" data-k="playoff"><option value="semis" ${f.playoff === "semis" ? "selected" : ""}>Top 4: semis + final</option><option value="final" ${f.playoff === "final" ? "selected" : ""}>Top 2: final</option><option value="none" ${f.playoff === "none" ? "selected" : ""}>None, league winner</option></select></label>
      <label class="f">Match length<select id="ff-min" data-input="ff" data-k="minutes">${[6, 8, 10, 12, 15].map(v => `<option value="${v}" ${f.minutes === v ? "selected" : ""}>${v} min incl. setup</option>`).join("")}</select></label>
    </div>
    <p class="small muted">${n >= 2 ? `${games} matches · about ${Math.floor(games * f.minutes / 60)}h ${games * f.minutes % 60}m on one console` : "Mark at least 2 players for FIFA in the Players tab."}${f.playoff === "semis" && n < 4 ? " Semis need 4+ players." : ""}</p>
    <div class="row">${M().length ? confirmBtn("gen", "Redraw schedule (clears scores)", "danger") : `<button class="btn pitch" data-act="gen" id="ff-gen" ${n < 2 ? "disabled" : ""}>Draw schedule</button>`}</div>
  </section>`;
  if (!M().length) return setup;
  const st = standings(), q = f.playoff === "semis" ? 4 : f.playoff === "final" ? 2 : 1;
  return `
  ${changed ? `<div class="notice warn">The FIFA player list changed since the draw. Redraw the schedule below to include everyone.</div>` : ""}
  <section class="panel"><h2>${ch ? "Champion" : "On the pitch"}</h2>
    ${ch ? `<div class="champ">🏆︎ ${esc(nm(ch))}</div>` : ""}
    ${cur ? matchEditor(cur) : ""}
    ${cur ? (() => { const nx = M().filter(m => !m.done).slice(1, 3); return nx.length ? `<h3>Get ready</h3><div class="list">${nx.map(m => `<div class="li"><span class="name">${esc(nm(m.a))} <span class="muted">v</span> ${esc(nm(m.b))}</span><span class="muted small">${stageName(m)}</span></div>`).join("")}</div>` : ""; })() : ""}
    ${!cur && !ch ? `<p class="muted">All matches played.</p>` : ""}
  </section>
  <section class="panel"><h2>League table</h2>
    <div class="tbl"><table><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>
    ${st.map((r, i) => `<tr class="${i < q && f.playoff !== "none" ? "q" : ""}"><td>${i + 1}</td><td>${esc(nm(r.id))}${team(r.id) ? `<div class="small muted" style="font-weight:400">${esc(team(r.id))}</div>` : ""}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf - r.ga > 0 ? "+" : ""}${r.gf - r.ga}</td><td><b>${r.pts}</b></td></tr>`).join("")}
    </tbody></table></div>
    ${f.playoff !== "none" ? `<p class="small muted">Top ${q} go to the ${f.playoff === "semis" ? "semi-finals" : "final"}. Ties split by goal difference, then goals scored.</p>` : ""}
  </section>
  ${KO.length ? `<section class="panel"><h2>Playoffs</h2><div class="list">${KO.map(m => mrow(m, m === cur)).join("")}</div><p class="small muted">* won on penalties</p></section>` : ""}
  <section class="panel"><h2>League fixtures <span class="tag fifa">${L.filter(m => m.done).length}/${L.length} played</span></h2>
    <div class="list">${L.map(m => mrow(m, m === cur)).join("")}</div></section>
  ${setup}`;
}

function viewPlayers() {
  const list = P(), np = list.filter(p => p.poker).length, nf = list.filter(p => p.fifa).length;
  return `<section class="panel"><h2>Players <span class="tag">${list.length}</span> <span class="tag poker">${np} poker</span> <span class="tag fifa">${nf} FIFA</span></h2>
    ${list.length ? `<div class="list">${list.map(p => `<div class="prow">
      <input type="text" id="pn-${p.id}" data-input="pname" data-id="${p.id}" value="${esc(p.name)}" placeholder="Name" aria-label="Name">
      <input type="text" class="team" id="pt-${p.id}" data-input="pteam" data-id="${p.id}" value="${esc(p.team || "")}" placeholder="FIFA team (optional)" aria-label="FIFA team">
      <button class="toggle p ${p.poker ? "on" : ""}" data-act="tog" data-k="poker" data-id="${p.id}" id="tp-${p.id}" aria-pressed="${!!p.poker}">Poker</button>
      <button class="toggle f ${p.fifa ? "on" : ""}" data-act="tog" data-k="fifa" data-id="${p.id}" id="tf-${p.id}" aria-pressed="${!!p.fifa}">FIFA</button>
      <button class="x" data-act="rm" data-id="${p.id}" id="rm-${p.id}" aria-label="Remove ${esc(p.name)}">×</button>
    </div>`).join("")}</div>` : `<p class="muted">No players yet. Add them one by one, or start with placeholders and rename.</p>`}
    <div class="row" style="margin-top:12px">
      <button class="btn primary" data-act="add" id="pl-add">Add player</button>
      ${list.length < 12 ? `<button class="btn" data-act="quickfill" id="pl-fill">Fill up to 12</button>` : ""}
      ${list.length >= 2 ? `<button class="btn" data-act="split" id="pl-split">Random split: 6 poker / rest FIFA</button>` : ""}
    </div>
    ${np > 9 ? `<p class="small neg">That's ${np} at one poker table. Six is comfortable; nine is the max.</p>` : ""}
    <p class="small muted">A player can be in both. Poker busts can still play FIFA matches between hands.</p>
  </section>`;
}

/* ---------- render ---------- */
const app = document.getElementById("app");
function render() {
  const sync = document.getElementById("sync");
  sync.textContent = !ready ? "Connecting…" : live ? "Live · shared" : "This device only";
  sync.className = "sync" + (live ? " live" : "");
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === ui.tab));
  const ae = document.activeElement, aid = ae && ae.id, sel = ae && "selectionStart" in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  app.innerHTML = ui.tab === "poker" ? viewPoker() : ui.tab === "fifa" ? viewFifa() : ui.tab === "players" ? viewPlayers() : viewTonight();
  if (aid) { const el = document.getElementById(aid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (sel && el.type === "text") el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  lastLevel = Math.floor(tElapsed() / levelMs());
}

/* clock tick: update only the digits; full render on level change */
let lastLevel = 0, actx = null;
function beep() { if (!actx) return; try { [0, .25, .5].forEach(t => { const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .15); }); } catch (e) {} }
setInterval(() => {
  const el = tElapsed(), lm = levelMs(), lvl = Math.floor(el / lm);
  if (lvl !== lastLevel) { if (S.poker.timer.running && lvl > lastLevel) { beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} } render(); return; }
  document.querySelectorAll("[data-time]").forEach(t => { t.textContent = fmtT(lm - (el % lm)); });
  document.querySelectorAll("[data-clock]").forEach(c => c.classList.toggle("ending", S.poker.timer.running && lm - (el % lm) < 60000));
}, 500);

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

/* ---------- actions ---------- */
function setTab(t) { ui.tab = t; ui.openMatch = null; try { localStorage.setItem("gn-tab", t); } catch (e) {} render(); window.scrollTo(0, 0); }
function newPlayer(name) { return { id: uid(), name, team: "", poker: false, fifa: false }; }
function setTimer(fn) { const t = S.poker.timer; const el = tElapsed(); fn(t, el); commit("poker"); }

const ACT = {
  go: d => setTab(d.tab),
  quickfill: () => { const l = S.players.list; let i = l.length; while (l.length < 12) l.push(newPlayer("Player " + (++i)));
    if (!l.some(p => p.poker || p.fifa)) l.forEach((p, j) => { p.poker = j < 6; p.fifa = j >= 6; });
    commit("players"); if (ui.tab === "tonight") setTab("players"); },
  add: () => { S.players.list.push(newPlayer("")); commit("players"); setTimeout(() => { const l = P(); const el = document.getElementById("pn-" + l[l.length - 1].id); el && el.focus(); }, 0); },
  rm: d => { S.players.list = P().filter(p => p.id !== d.id); commit("players"); },
  tog: d => { const p = byId(d.id); if (p) { p[d.k] = !p[d.k]; commit("players"); } },
  split: () => { const ids = shuffle(P().map(p => p.id)); P().forEach(p => { const i = ids.indexOf(p.id); p.poker = i < 6; p.fifa = i >= 6; });
    commit("players"); toast("Split done. Check the Poker and FIFA tabs."); },
  timer: () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    setTimer((t, el) => { if (t.running) { t.elapsed = el; t.running = false; } else { t.startedAt = Date.now(); t.running = true; } }); wake(); },
  "lvl-next": () => setTimer((t, el) => { t.elapsed = (Math.floor(el / levelMs()) + 1) * levelMs(); t.startedAt = Date.now(); }),
  "lvl-prev": () => setTimer((t, el) => { t.elapsed = Math.max(0, Math.floor(el / levelMs()) - 1) * levelMs(); t.startedAt = Date.now(); }),
  buyin: d => { const e = entry(d.id); e.buyIns = Math.max(1, e.buyIns + Number(d.d)); S.poker.entries[d.id] = e;
    if (Number(d.d) > 0) S.poker.bust = S.poker.bust.filter(i => i !== d.id); commit("poker"); },
  bust: d => { if (!S.poker.bust.includes(d.id)) S.poker.bust.push(d.id); commit("poker"); },
  unbust: d => { S.poker.bust = S.poker.bust.filter(i => i !== d.id); commit("poker"); },
  dealer: () => { const s = seatOrder(), b = busted(); if (!s.length) return; let i = S.poker.dealer % s.length;
    for (let k = 0; k < s.length; k++) { i = (i + 1) % s.length; if (!b.includes(s[i]) || S.poker.mode === "cash") break; }
    S.poker.dealer = i; commit("poker"); },
  seats: () => { S.poker.seats = shuffle(seatOrder()); S.poker.dealer = 0; commit("poker"); },
  gen: () => { const ids = fifaIds(); if (ids.length < 2) return; S.fifa.roster = ids; S.fifa.matches = roundRobin(ids, S.fifa.legs); ui.openMatch = null; commit("fifa"); },
  goal: d => { const m = M().find(x => x.id === d.id); if (!m || m.done) return; const k = d.side === "a" ? "ga" : "gb";
    m[k] = Math.max(0, m[k] + Number(d.d)); if (m.ga !== m.gb) m.pens = null; commit("fifa"); },
  pens: d => { const m = M().find(x => x.id === d.id); if (m) { m.pens = d.w; commit("fifa"); } },
  ft: d => { const m = M().find(x => x.id === d.id); if (!m) return; if (m.stage !== "league" && m.ga === m.gb && !m.pens) return;
    m.done = true; ui.openMatch = null; advance(); commit("fifa"); const ch = champion(); if (ch) toast(nm(ch) + " wins the tournament!"); },
  reopen: d => { const m = M().find(x => x.id === d.id); if (m) { m.done = false; ui.openMatch = m.id; commit("fifa"); } },
  open: d => { ui.openMatch = ui.openMatch === d.id ? null : d.id; render(); },
  confirm: d => { if (ui.armed !== d.key) { ui.armed = d.key; render(); clearTimeout(ACT._t); ACT._t = setTimeout(() => { ui.armed = null; render(); }, 3000); return; }
    ui.armed = null; clearTimeout(ACT._t);
    if (d.key === "reset-poker") { const keep = S.poker; S.poker = DEF.poker(); ["mode", "currency", "buyIn", "chips", "payout"].forEach(k => S.poker[k] = keep[k]); S.poker.timer.minutes = keep.timer.minutes; commit("poker"); toast("Poker game reset"); }
    if (d.key === "reset-timer") { const t = S.poker.timer; t.running = false; t.elapsed = 0; commit("poker"); }
    if (d.key === "gen") { ACT.gen(); toast("New schedule drawn"); } }
};

document.addEventListener("click", e => {
  const tab = e.target.closest("#tabs button"); if (tab) return setTab(tab.dataset.tab);
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset);
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.input; if (!k) return;
  if (k === "pname" || k === "pteam") { const p = byId(el.dataset.id); if (!p) return; p[k === "pname" ? "name" : "team"] = el.value.slice(0, 40); commitSoon("players"); }
  if (k === "cashout") { const e2 = entry(el.dataset.id); e2.cashOut = el.value === "" ? null : Math.max(0, Number(el.value)); S.poker.entries[el.dataset.id] = e2; commitSoon("poker"); }
  if (k === "pk" && el.tagName === "INPUT") { const key = el.dataset.k; if (key === "currency") S.poker.currency = el.value.slice(0, 3);
    else { const v = Number(el.value); if (v > 0) S.poker[key] = v; } commitSoon("poker"); }
});
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset.input; if (!k) return;
  if (k === "pk" && el.tagName === "SELECT") { S.poker[el.dataset.k] = el.value; commit("poker"); }
  if (k === "pkmin") { const t = S.poker.timer, lvl = Math.floor(tElapsed() / levelMs()); t.minutes = Number(el.value); t.elapsed = lvl * levelMs(); t.startedAt = Date.now(); commit("poker"); }
  if (k === "ff") { S.fifa[el.dataset.k] = el.dataset.k === "playoff" ? el.value : Number(el.value); commit("fifa"); }
  if (k === "pname" || k === "pteam" || k === "cashout" || (k === "pk" && el.tagName === "INPUT")) commit(k === "cashout" || k === "pk" ? "poker" : "players");
});

/* keep the screen on while the poker clock is open */
let lock = null;
async function wake() { try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.poker.timer.running) wake(); });

/* ---------- boot ---------- */
render();
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("db").then(d => {
    ready = true;
    if (d) { db = d; live = true; subscribe(); } else { loadLocal(); }
    render();
  }).catch(() => { ready = true; loadLocal(); render(); });
} else { ready = true; loadLocal(); render(); }
})();
</script>
